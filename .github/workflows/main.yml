name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Java version
        run: |
          java -version
          javac -version

      - name: Build Web Project
        run: npm run build

      - name: Setup Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - name: Inject Firebase google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret not set - push notifications disabled in this APK."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          # Mark this APK as Firebase-ready so the web code enables native push safely.
          CFG=android/app/src/main/assets/capacitor.config.json
          node -e "const f=require('fs');const p='$CFG';const c=JSON.parse(f.readFileSync(p));c.appendUserAgent=((c.appendUserAgent||'')+' FXPushReady').trim();f.writeFileSync(p,JSON.stringify(c,null,2));"
          echo "Firebase config injected."

      - name: Generate App Icons and Splash Screens
        run: npx @capacitor/assets generate --android




      - name: Build Android APK
        run: |
          cd android
          ./gradlew --version
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
